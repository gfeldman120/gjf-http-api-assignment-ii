<!DOCTYPE html>
<html lang="en">
<head>
  <title>Our simple HTTP server</title>
  <link rel="stylesheet" type="text/css" href="/style.css">
  
  <script>

    // Get response, change text and show results
    const handleResponse = async (response) => {
      const content = document.querySelector('#content');
      // Change title text based on status code
      switch(response.status) {
        case 200:
          content.innerHTML = `<b>Success</b>`;
          break;
        case 201:
          content.innerHTML = '<b>Created</b>';
          break;
        case 204:
          content.innerHTML = '<b>Updated (No Content)</b>';
          return;
        case 400:
          content.innerHTML = `<b>Bad Request</b>`;
          break;
        default: 
          content.innerHTML = `<b>Not Found<b>`;
          break;
      }
      // Not using response.json() to avoid parsing errors in console when making HEAD request
      let text = await response.text();
      if(text) {
        let object = JSON.parse(text);
        if(object.message) {
          content.innerHTML += `<p>Message: ${object.message}</p>`;
        } else {
          let jsonString = JSON.stringify(object);
          content.innerHTML += `<p>${jsonString}</p>`;
        }
      }
    }

    // Make a GET or HEAD request
    const getRequest = async () => {
      const url = document.querySelector('#urlField').value;
      const method = document.querySelector('#methodSelect').value;
      let response = await fetch(url, {
        method: method,
        headers: {
          'Accept': 'application/json'
        },
      });
      handleResponse(response);
    }

    // Make a POST request
    const postRequest = async () => {
      const url = document.querySelector('#nameForm').action;
      const name = document.querySelector('#nameField').value;
      const age = document.querySelector('#ageField').value;
      // Format data
      const formattedData = `name=${encodeURIComponent(name)}&age=${encodeURIComponent(age)}`;
      let response = await fetch(url, {
        method: 'POST',
        headers: {
          'Accept': 'application/json',
          'Content-Type': 'application/x-www-form-urlencoded'
        },
        body: formattedData
      });
      handleResponse(response);
    }

    // Page setup
    const init = () => {
      const addUserButton = document.querySelector('#nameForm');
      addUserButton.addEventListener('submit', (e) => { 
        e.preventDefault();
        postRequest();
        });
      const getUsersButton = document.querySelector('#userForm');
      getUsersButton.addEventListener('submit', (e) => { 
        e.preventDefault();
        getRequest();
        });
    }

    window.onload = init;

  </script>
</head>
<body>
  <section id="top">
    <h3>POST Status Code Tests</h3>
    <form id="nameForm" action="/addUser" method="post">
      <label for="name">Name: </label>
      <input id="nameField" type="text" name="name" />
      <label for="age">Age: </label>
      <input id="ageField" type="number" name="age" min="0" max="100" step="1"/>
      <input type="submit" value="Add User" />
    </form>
    <form id="userForm" action="/getUsers" method="get">
      <select id='urlField'>
        <option value='/getUsers'>/getUsers</option>
        <option value='/notReal'>/notReal</option>
      </select>
      <select id="methodSelect">
        <option value="get">GET</option>
        <option value="head">HEAD</option>
      </select>
      <input type="submit" value="Get User" />
    </form>
  </section>
  <section id="content">
  </section>
</body>
</html>
