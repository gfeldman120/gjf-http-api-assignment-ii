<!DOCTYPE html>
<html lang="en">
<head>
  <title>Our simple HTTP server</title>
  <link rel="stylesheet" type="text/css" href="/style.css">
  
  <script>

    // Taken from 1st assignment, need to change for this one
    const handleResponse = async (response) => {
      const content = document.querySelector('#content');
      let object = await response.json();
      let jsonString = JSON.stringify(object);
      console.log(jsonString);
      let result = `Message: ${jsonString.split('message":"')[1].split('"')[0]}`;
      content.innerHTML += `<p>${result}</p>`;
    }

    // Make a GET request
    const getRequest = async () => {
      const url = document.querySelector('#urlField').value;
      const method = document.querySelector('#methodSelect').value;
      let response = await fetch(url, {
        method: method,
        headers: {
          'Accept': 'application/json'
        },
      });
      handleResponse(response);
    }

    const postRequest = async () => {
      const url = document.querySelector('#urlField').value;
      let response = await fetch(url, {
        method: 'POST',
        headers: {
          'Accept': 'application/json'
        },
      });
      handleResponse(response);
    }

    // Page setup
    const init = () => {
      const sendButton = document.querySelector('#send');
      sendButton.addEventListener('click', () => { getRequest() });
    }

    window.onload = init;

  </script>
</head>
<body>
  <section id="top">
    <h3>POST Status Code Tests</h3>
    <form id="nameForm" action="/addUser" method="post">
      <label for="name">Name: </label>
      <input id="nameField" type="text" name="name" />
      <label for="age">Age: </label>
      <input id="ageField" type="number" name="age" min="0" max="100" step="1"/>
      <input type="submit" value="Add User" />
    </form>
    <form id="userForm" action="/getUsers" method="get">
      <select id='urlField'>
        <option value='/getUsers'>/getUsers</option>
        <option value='/notReal'>/notReal</option>
      </select>
      <select id="methodSelect">
        <option value="get">GET</option>
        <option value="head">HEAD</option>
      </select>
      <input type="submit" value="Get User" />
    </form>
  </section>
  <section id="content">
  </section>
</body>
</html>
